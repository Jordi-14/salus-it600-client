repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python3 -m ruff check salus_it600 tests main.py
        language: system
        pass_filenames: false
        types_or: [python]
      - id: mypy
        name: mypy strict
        entry: python3 -m mypy
        language: system
        pass_filenames: false
        types_or: [python]
